{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'app/test.css' %}">
</head>
<body>

<div class="header">
    <div class="timer">⏱ <span id="timer">10:00</span></div>

    <div class="header-title">
        <h5>TEST</h5>
        <small>TEST</small>
    </div>

    <div class="photo-box">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="User photo">
        <div>{{ full_name }}</div>
    </div>
</div>

<div class="container">
    <form method="post" id="test-form">
        {% csrf_token %}
        <input type="hidden" name="start_time" value="{{ start_time }}">
        {% for question in questions %}
        <div class="question-box">
            <p><strong>{{ forloop.counter }}. {{ question.text }}</strong></p>
        {% for answer in question.randomized_answers %}
        <label class="answer-option" for="q{{ question.id }}_a{{ answer.id }}">
            <input type="radio" name="question_{{ question.id }}" value="{{ answer.id }}" id="q{{ question.id }}_a{{ answer.id }}" required>
            <span>{{ answer.text }}</span>
        </label>
        {% endfor %}
        </div>
        {% endfor %}

        <div class="submit-box">
            <button type="submit" class="finish-btn">Закончить</button>
        </div>
    </form>
</div>
<script src="{% static 'app/script.js' %}"></script>
</body>
</html>
