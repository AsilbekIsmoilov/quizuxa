{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card mx-auto shadow" style="max-width: 400px;">
        <div class="card-header bg-primary text-white text-center">
<h4>
  <img src="{% static 'img/logo.png' %}" alt="Icon" width="70" height="70" style="vertical-align: middle; margin: 0 8px;">
  Platform
</h4>       
</div>
        <div class="card-body">
            {% if messages %}
  <div class="alert alert-danger" role="alert">
    {% for message in messages %}
      <div>{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" id="id_username" required>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Вход</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
